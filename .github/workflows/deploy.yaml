name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # The frontend is served from the committed ctij-frontend/dist, so the VPS
      # must never rebuild it (a local build would bake in the wrong API URL).
      - name: Deploy to VPS
        run: |
          ssh "${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST }}" 'bash -s' << 'EOF'
            set -euo pipefail
            cd /var/www/cabinet-tij

            echo ">>> Fetching origin/main..."
            git fetch origin
            CHANGED=$(git diff --name-only HEAD origin/main || true)

            echo ">>> Resetting to origin/main..."
            git reset --hard origin/main

            SERVICES="frontend nginx"
            if echo "$CHANGED" | grep -q '^ctij-api/'; then
              SERVICES="laravel $SERVICES"
            fi

            echo ">>> Restarting: $SERVICES"
            docker compose restart $SERVICES

            echo ">>> Deployed $(git rev-parse --short HEAD)"
          EOF
